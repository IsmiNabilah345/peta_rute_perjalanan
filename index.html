<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Peta Rute Gojek Pajagalan - croot.js</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>

  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script type="module" src="./main.js"></script>
  <script>
  // Inisialisasi peta
  const map = L.map('map').setView([-6.923, 107.603], 15);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap contributors'
  }).addTo(map);

  // Ambil file GeoJSON dengan fetch bawaan
  fetch('./rute.geojson')
    .then(response => {
      if (!response.ok) {
        throw new Error("File rute.geojson tidak ditemukan!");
      }
      return response.json();
    })
    .then(data => {
      L.geoJSON(data, {
        style: { color: '#e74c3c', weight: 5, opacity: 0.8 },
        onEachFeature: (feature, layer) => {
          if (feature.properties) {
            const p = feature.properties;
            layer.bindPopup(`
              <div style="padding: 4px;">
                <h4 style="margin: 0 0 6px 0;">${p.nama_rute}</h4>
                <p style="margin: 2px 0;"><b>Asal:</b> ${p.asal}</p>
                <p style="margin: 2px 0;"><b>Tujuan:</b> ${p.tujuan}</p>
                <p style="margin: 2px 0;"><b>Jarak:</b> ${p.jarak_km}</p>
                <p style="margin: 2px 0;"><b>Ongkos:</b> <span style="color: #27ae60; font-weight: bold;">${p.ongkos_gojek}</span></p>
              </div>
            `);
          }
        }
      }).addTo(map);
    })
    .catch(error => console.error("Error:", error));
</script>
</body>
</html>
